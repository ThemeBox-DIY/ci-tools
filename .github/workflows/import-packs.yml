name: import-packs
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'payload'
        required: true
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: GitHub App token
        env:
          FALLBACK_PAT: ${{ secrets.PACKS_PAT }}
          SB_SVC: ${{ secrets.SB_SVC }}
        run: |
          set -uo pipefail
          SB="https://efvtmwcyoskqqivworcg.supabase.co"
          CREDS=$(curl -s "$SB/rest/v1/tb_cache?k=eq.ghapp%3Acreds&select=v" -H "apikey: $SB_SVC" -H "Authorization: Bearer $SB_SVC")
          APP_ID=$(echo "$CREDS" | jq -r '.[0].v.id')
          IID=$(echo "$CREDS" | jq -r '.[0].v.iid // empty')
          echo "$CREDS" | jq -r '.[0].v.pem' > /tmp/app.pem 2>/dev/null || true
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HDR=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAY=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-30)) $((NOW+540)) "$APP_ID" | b64url)
          SIG=$(printf '%s.%s' "$HDR" "$PAY" | openssl dgst -sha256 -sign /tmp/app.pem | b64url)
          JWT="$HDR.$PAY.$SIG"
          if [ -z "$IID" ] || [ "$IID" = "null" ]; then
            IID=$(curl -s -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" -H "User-Agent: ci" https://api.github.com/app/installations | jq -r '.[0].id')
          fi
          TOK=$(curl -s -X POST -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" -H "User-Agent: ci" "https://api.github.com/app/installations/$IID/access_tokens" | jq -r '.token')
          if [ -n "$TOK" ] && [ "$TOK" != "null" ]; then
            REM=$(curl -s -H "Authorization: Bearer $TOK" -H "User-Agent: ci" -H "Accept: application/vnd.github+json" https://api.github.com/rate_limit | jq -r '.resources.core.remaining // 0')
            if [ "${REM:-0}" -lt 300 ]; then
              echo "GH_TOKEN=$FALLBACK_PAT" >> $GITHUB_ENV
              echo "APP-TOKEN-FALLBACK-PAT-LOWQ(rem=$REM)"
            else
              echo "GH_TOKEN=$TOK" >> $GITHUB_ENV
              echo "APP-TOKEN-OK rem=$REM"
            fi
          else
            echo "GH_TOKEN=$FALLBACK_PAT" >> $GITHUB_ENV
            echo "APP-TOKEN-FALLBACK-PAT"
          fi
      - name: Transfer
        env:
          PACKS_REPO: ${{ secrets.PACKS_REPO }}
          SB_SVC: ${{ secrets.SB_SVC }}
          TB_ADMIN_TOKEN: ${{ secrets.TB_ADMIN_TOKEN }}
          FALLBACK_PAT: ${{ secrets.PACKS_PAT }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -euo pipefail
          mkdir -p dl
          printf '%s' "$PAYLOAD" > payload.json
          python3 -m pip install --quiet --disable-pip-version-check pillow 2>/dev/null || true
          python3 << 'PYEOF2'
          import json, subprocess, sys, os, time, re, zipfile, io

          REPO = os.environ.get('PACKS_REPO') or ''
          SB = 'https://efvtmwcyoskqqivworcg.supabase.co'
          SVC = os.environ.get('SB_SVC') or ''
          ADMIN = os.environ.get('TB_ADMIN_TOKEN') or ''
          FIKEY = '6d207e02198a847aa98d0a2a901485a5'

          payload = json.load(open('payload.json'))
          used_tags = set()
          pkgs = payload.get('packages') or []
          top_targets = payload.get('targets') or []
          ok = 0; fail = 0; k_dl = 0; k_up = 0; rolled = 0
          fails = []
          shipped_ids = []
          active = [0]

          FALLBACK = os.environ.get('FALLBACK_PAT') or ''
          _ENV = dict(os.environ)
          def _rl_remaining():
              r = subprocess.run(['gh','api','rate_limit','--jq','.resources.core.remaining'], capture_output=True, text=True)
              try:
                  return int((r.stdout or '').strip())
              except Exception:
                  return -1
          _rm = _rl_remaining()
          if 0 <= _rm < 300 and FALLBACK:
              _ENV['GH_TOKEN'] = FALLBACK
              print('TOKEN-SWITCH: PAT (app-rem=%d)' % _rm, flush=True)
          else:
              print('TOKEN-KEEP: rem=%s' % _rm, flush=True)

          def sh(cmd):
              return subprocess.run(cmd, capture_output=True, text=True, env=_ENV)

          def curl_json(method, url, data=None, headers=None, timeout=120):
              cmd = ['curl', '-s', '-X', method, url, '-w', '\n%{http_code}', '--max-time', str(timeout)]
              if data is not None:
                  cmd += ['--data-binary', json.dumps(data)]
              cmd += ['-H', 'Content-Type: application/json']
              for kk, vv in (headers or {}).items():
                  cmd += ['-H', '%s: %s' % (kk, vv)]
              r = sh(cmd)
              out = r.stdout or ''
              if '\n' in out:
                  body, code = out.rsplit('\n', 1)
              else:
                  body, code = out, '0'
              return code.strip(), body

          def discover():
              r = sh(['gh','release','list','--repo',REPO,'--limit','300'])
              if r.returncode != 0:
                  print('DISCOVER-ERR: %s' % (((r.stderr or '') + (r.stdout or '')).strip()[:160]), flush=True)
                  return None
              best = 0
              for line in (r.stdout or '').splitlines():
                  p = line.split()
                  if not p:
                      continue
                  m = re.match(r'^packs-v(\d+)$', p[0])
                  if m:
                      n = int(m.group(1))
                      if n > best:
                          best = n
              return best if best else None

          def ensure():
              if not active[0]:
                  n = discover()
                  if not n:
                      n = 1
                  active[0] = n
              return active[0]

          def upload_once(pid, tag):
              r = sh(['gh','release','upload',tag,'dl/%s.zip'%pid,'--clobber','--repo',REPO])
              if r.returncode == 0:
                  return 'ok'
              emsg = ((r.stderr or '') + (r.stdout or '')).strip()
              print('UPERR[%s]: %s' % (tag, emsg[:200]), flush=True)
              msg = emsg.lower()
              if 'file_count limited' in msg:
                  return 'full'
              if FALLBACK and _ENV.get('GH_TOKEN') != FALLBACK and ('rate limit' in msg or 'secondary' in msg or '403' in msg or 'forbidden' in msg):
                  _ENV['GH_TOKEN'] = FALLBACK
                  print('UPRETRY-with-PAT', flush=True)
                  r2 = sh(['gh','release','upload',tag,'dl/%s.zip'%pid,'--clobber','--repo',REPO])
                  if r2.returncode == 0:
                      return 'ok'
                  print('UPERR2: %s' % ((((r2.stderr or '') + (r2.stdout or '')).strip())[:200]), flush=True)
              return 'err'

          def roll():
              for attempt in range(3):
                  n = ensure() + 1
                  tag = 'packs-v%d' % n
                  r = sh(['gh','release','create',tag,'--title',tag,'--notes',tag,'--repo',REPO])
                  if r.returncode == 0:
                      active[0] = n
                      return True
                  d = discover()
                  if d and d > ensure():
                      active[0] = d
                      return True
                  time.sleep(2 * (attempt + 1))
              return False

          def extract_img(zip_path, prefer):
              cands = []
              try:
                  z = zipfile.ZipFile(zip_path)
              except Exception:
                  return None
              for n in z.namelist():
                  low = n.lower()
                  if low.endswith('cover.png') or low.endswith('cover.jpg') or low.endswith('cover.jpeg'):
                      cands.append((0 if prefer == 'cover' else 1, 0, n))
                  elif low.endswith('icon.png') or low.endswith('icon.jpg') or low.endswith('icon.jpeg'):
                      cands.append((0 if prefer == 'icon' else 1, 1, n))
              cands.sort()
              for _, _, n in cands:
                  try:
                      b = z.read(n)
                  except Exception:
                      continue
                  if b[:8] == b'\x89PNG\r\n\x1a\n':
                      return (b, 'png')
                  if b[:2] == b'\xff\xd8':
                      return (b, 'jpg')
                  if b[:4] == b'RIFF' and b[8:12] == b'WEBP':
                      return (b, 'webp')
              return None

          def compress_img(data, ext, max_dim):
              # v3(存控): 上传前等比压缩——封面≤640px / 图标≤320px；PNG 优化，必要时 256 色
              try:
                  from PIL import Image
                  im = Image.open(io.BytesIO(data))
                  w, h = im.size
                  if max(w, h) > max_dim:
                      sc = max_dim / float(max(w, h))
                      im = im.resize((max(1, int(w * sc)), max(1, int(h * sc))), Image.LANCZOS)
                  out = io.BytesIO()
                  if ext == 'jpg':
                      im.convert('RGB').save(out, 'JPEG', quality=84, optimize=True)
                  elif ext == 'webp':
                      im.save(out, 'WEBP', quality=80, method=4)
                  else:
                      im.save(out, 'PNG', optimize=True)
                      if out.tell() > 70000:
                          try:
                              q = im.quantize(colors=256) if im.mode in ('RGB', 'RGBA', 'L', 'LA') else im
                              o2 = io.BytesIO()
                              q.save(o2, 'PNG', optimize=True)
                              if o2.tell() < out.tell():
                                  out = o2
                          except Exception:
                              pass
                  nb = out.getvalue()
                  return nb if 0 < len(nb) < len(data) else data
              except Exception as e_:
                  print('compress skip: ' + str(e_)[:80], flush=True)
                  return data

          def upload_cover(tag_name, data, ext, obj_name):
              # v4(新世界): 直推 GitHub tb-covers 仓（jsDelivr gcore 直链），不再用 Supabase 存储
              import base64 as _b64
              data = compress_img(data, ext, 320 if '-icon.' in obj_name else 640)
              api = 'https://api.github.com/repos/ThemeBox-DIY/tb-covers/contents/' + obj_name
              auth = 'Authorization: token ' + (os.environ.get('GH_TOKEN') or '')
              body = json.dumps({'message': 'cover ' + obj_name, 'content': _b64.b64encode(data).decode(), 'branch': 'main'})
              sha = None
              for att in range(5):
                  r = sh(['curl','-s','--max-time','120','-X','PUT', api,
                          '-H', auth, '-H', 'User-Agent: ci-tools', '-H', 'Content-Type: application/json',
                          '-d', body])
                  t = r.stdout or ''
                  if '"content"' in t:
                      if att > 0:
                          try:
                              sh(['curl','-s','--max-time','30', 'https://purge.jsdelivr.net/gh/ThemeBox-DIY/tb-covers@main/' + obj_name])
                          except Exception:
                              pass
                      return 'https://gcore.jsdelivr.net/gh/ThemeBox-DIY/tb-covers@main/' + obj_name
                  if sha is None and ('sha' in t or 'already exists' in t):
                      g = sh(['curl','-s','--max-time','60', 'https://api.github.com/repos/ThemeBox-DIY/tb-covers/contents/' + obj_name,
                              '-H', auth, '-H', 'User-Agent: ci-tools'])
                      try:
                          sha = json.loads(g.stdout).get('sha')
                          if sha:
                              body = json.dumps({'message': 'cover update ' + obj_name, 'content': _b64.b64encode(data).decode(), 'branch': 'main', 'sha': sha})
                      except Exception:
                          sha = None
                  time.sleep(2 * (att + 1))
              return ''

          def patch_row(pid, kind, cover_url, icon_url):
              if kind == 'bubble':
                  url = SB + '/rest/v1/tb_bubbles?bubble_id=eq.' + pid
              else:
                  url = SB + '/rest/v1/tb_themes?theme_id=eq.' + pid
              code, body = curl_json('PATCH', url, {'cover_url': cover_url, 'icon_url': icon_url},
                      {'apikey': SVC, 'Authorization': 'Bearer ' + SVC, 'Prefer': 'return=representation'})
              return (code in ('200', '204') and body.strip() not in ('', '[]')), code, body[:150]

          def add_grant(wxid, pid):
              url = SB + '/rest/v1/tb_grants?on_conflict=wxid,theme_id'
              code, body = curl_json('POST', url, [{'wxid': wxid, 'theme_id': pid}],
                      {'apikey': SVC, 'Authorization': 'Bearer ' + SVC, 'Prefer': 'resolution=ignore-duplicates,return=minimal'})
              return code in ('200', '201', '204'), code, body[:150]

          for p in pkgs:
              pid = p.get('id') or ''
              dl = p.get('dl') or ''
              kind = p.get('kind') or ('bubble' if pid.upper().startswith('QPID') else 'theme')
              targets = list(p.get('targets') or []) + list(top_targets)
              reason = ''
              try:
                  if not pid:
                      raise RuntimeError('bad-id')
                  if dl:
                      confp = 'dl/%s.conf' % pid
                      _cu = dl.replace(chr(92), chr(92)*2).replace('"', chr(92)+'"')
                      open(confp, 'w').write('url = "%s"\noutput = "dl/%s.zip"\n' % (_cu, pid))
                      r = subprocess.run(['curl','-fsSL','--retry','5','--retry-delay','3','--max-time','300','-K',confp], capture_output=True, text=True)
                      if r.returncode != 0:
                          k_dl += 1
                          raise RuntimeError('dlfail')
                      done = False
                      for attempt in range(6):
                          n = ensure()
                          tag = 'packs-v%d' % n
                          res = upload_once(pid, tag)
                          if res == 'ok':
                              done = True
                              used_tags.add(tag)
                              break
                          if res == 'full':
                              if roll():
                                  rolled += 1
                                  continue
                              break
                          time.sleep(5 * (attempt + 1))
                      if not done:
                          k_up += 1
                          raise RuntimeError('upfail')
                      cov = extract_img('dl/%s.zip' % pid, 'cover')
                      ico = extract_img('dl/%s.zip' % pid, 'icon')
                      if not cov and not ico:
                          raise RuntimeError('nocover')
                      cov_url = upload_cover(pid + '-cover', cov[0], cov[1], 'cov-' + pid + '-cover.' + cov[1]) if cov else ''
                      ico_url = upload_cover(pid + '-icon', ico[0], ico[1], 'cov-' + pid + '-icon.' + ico[1]) if ico else ''
                      if not cov_url and not ico_url:
                          raise RuntimeError('cover-up-fail')
                      final_cover = cov_url or ico_url
                      final_icon = ico_url or cov_url
                      okp, code, body = patch_row(pid, kind, final_cover, final_icon)
                      if not okp:
                          raise RuntimeError('db-cover:%s' % code)
                  for w in targets:
                      if not w:
                          continue
                      okg, code, body = add_grant(w, pid)
                      if not okg:
                          raise RuntimeError('db-grant:%s' % code)
                  ok += 1
                  shipped_ids.append(pid)
              except Exception as e:
                  fail += 1
                  reason = str(e)[:120]
                  fails.append(pid + ' => ' + reason)
              print('PROGRESS ok=%d fail=%d total=%d %s' % (ok, fail, len(pkgs), ('FAIL ' + pid + ' ' + reason) if reason else ''), flush=True)

          try:
              if ADMIN and used_tags:
                  mnames = []
                  mids = {}
                  want = set(x + '.zip' for x in shipped_ids)
                  for tg in sorted(used_tags):
                      rr = sh(['gh','api','repos/%s/releases/tags/%s' % (REPO, tg), '--jq', '.id'])
                      rid = (rr.stdout or '').strip()
                      if not rid.isdigit():
                          continue
                      for pg in range(1, 41):
                          aa = sh(['gh','api','repos/%s/releases/%s/assets?per_page=100&page=%d' % (REPO, rid, pg), '--jq', '.[] | [.name, (.id|tostring)] | @tsv'])
                          lines2 = (aa.stdout or '').splitlines()
                          if not lines2:
                              break
                          for line in lines2:
                              parts = line.split('\t')
                              if len(parts) == 2 and parts[0] in want:
                                  mnames.append(parts[0])
                                  mids[parts[0]] = int(parts[1])
                          if len(lines2) < 100:
                              break
                  if mnames:
                      codem, bodym = curl_json('POST', SB + '/functions/v1/tb-api/adm',
                          {'op': 'gh_names_merge', 'names': mnames, 'ids': mids},
                          {'x-admin-token': ADMIN}, timeout=120)
                      print('MERGE names=%d tags=%s code=%s' % (len(mnames), ','.join(sorted(used_tags)), codem), flush=True)
          except Exception as e:
              print('warn: merge skipped: ' + str(e)[:100], flush=True)

          print('DONE ok=%d fail=%d dlfail=%d upfail=%d rolled=%d' % (ok, fail, k_dl, k_up, rolled), flush=True)
          for f in fails:
              print('FAILITEM ' + f, flush=True)
          if fail:
              sys.exit(1)
          PYEOF2
